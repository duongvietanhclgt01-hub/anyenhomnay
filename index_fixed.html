.coins{display:flex;gap:16px;justify-content:center;margin:10px 0;min-height:56px}.coin{width:54px;height:54px;border-radius:50%;background:radial-gradient(#f0c060,#a8782c);display:grid;place-items:center;font-size:20px;font-family:"Noto Serif CJK SC","Noto Serif SC","Songti SC","SimSun","Microsoft YaHei","PingFang SC",serif;color:#4a3210;box-shadow:inset 0 0 0 6px #0002}.coin.spin{animation:fl .5s linear 2}@keyframes fl{to{transform:rotateY(360deg) translateY(-28px)}}

.trad{border-left:3px solid var(--wood);padding-left:12px}.mod{border-left:3px solid var(--moss);padding-left:12px}.q{font-style:italic;text-align:center;margin:12px 0}small,.note{color:#7a5a3a;font-size:13px}

#cat .ec,#cat .zz,#fish,#cup,#ball{display:none}#cat.cl .eo{display:none}#cat.cl .ec{display:block}
#cat .tail{transform-origin:60px 20px;animation:tl 2.4s ease-in-out infinite}@keyframes tl{50%{transform:rotate(18deg)}}

#cat .eo{animation:bl 5s infinite;transform-origin:0 -42px}@keyframes bl{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}

.night #sky{fill:#1b2740}.night #dim{opacity:.55}.night #moon{opacity:1}.night .glow{opacity:.9}
#moon,.glow{opacity:0;transition:opacity 1s}#dim{opacity:0;transition:opacity 1s}.koi{animation:sw 9s ease-in-out infinite alternate}@keyframes sw{to{transform:translateX(60px)}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}

"use strict";
/* ===== DỮ LIỆU 64 QUẺ (thứ tự Văn Vương) – tên|đại ý|lời khuyên ===== */
const H=`Càn|Sức sáng tạo, chính đạo, kiên trì tiến lên|Giữ chí lớn nhưng đừng nóng vội; hành động đều đặn mỗi ngày
Khôn|Mềm mại nâng đỡ, nhẫn nại như đất|Đi sau, lắng nghe và nuôi dưỡng điều đang có
Truân|Buổi đầu gian nan, mầm non gặp đá|Chưa cần xong ngay; tìm người đồng hành và đi từng bước nhỏ
Mông|Còn mờ mịt, cần học hỏi bằng lòng khiêm tốn|Hỏi người đi trước và chấp nhận mình chưa biết
Nhu|Chờ đúng thời, nuôi sức trước cơn mưa|Kiên nhẫn chuẩn bị, ăn ngủ đủ, đừng liều
Tụng|Tranh chấp, bất đồng|Lùi một bước, tìm điểm chung, tránh kéo dài xung đột
Sư|Kỷ luật, tập hợp sức mạnh vì chính nghĩa|Cần người dẫn dắt có đức và kế hoạch rõ ràng
Tỉ|Gần gũi, hợp tác, nương tựa lẫn nhau|Chọn người đáng tin và kết nối chân thành
Tiểu Súc|Tích lũy nhỏ, mây dày chưa mưa|Làm việc nhỏ đều tay; chưa phải lúc bứt phá
Lý|Bước sau đuôi hổ, cẩn trọng giữ lễ|Cư xử đúng mực, quan sát rủi ro rồi mới bước
Thái|Hanh thông, trời đất giao hòa|Tận dụng thuận lợi nhưng đừng chủ quan
Bĩ|Bế tắc, trên dưới không thông|Giữ mình, giảm tham vọng, chờ thế xoay
Đồng Nhân|Đồng lòng cùng người, cởi mở|Chia sẻ mục tiêu chung, bỏ bớt định kiến
Đại Hữu|Dồi dào, sáng như mặt trời trên cao|Đủ đầy phải đi cùng khiêm nhường và sẻ chia
Khiêm|Khiêm tốn, bớt chỗ thừa bù chỗ thiếu|Hạ cái tôi xuống; càng khiêm càng được lòng người
Dự|Vui vẻ, hứng khởi, chuẩn bị sẵn sàng|Tận hưởng nhưng đừng sa đà; chuẩn bị chu đáo
Tùy|Thuận theo thời và lòng người|Linh hoạt, theo điều đúng thay vì cố chấp
Cổ|Sửa chữa điều hư hỏng tích tụ|Nhìn thẳng vấn đề cũ và dọn dẹp từng phần
Lâm|Cơ hội đang lớn dần, tiến tới|Nắm cơ hội với tâm vững; giữ đức cho lâu dài
Quan|Quan sát, soi chiếu, làm gương|Đứng xa nhìn toàn cảnh trước khi quyết định
Phệ Hạp|Cắn xuyên chướng ngại, xử lý dứt khoát|Nói rõ điều cản trở và giải quyết công bằng
Bí|Trang điểm, vẻ đẹp bên ngoài|Chăm hình thức nhưng đừng quên phần cốt lõi
Bác|Bào mòn, suy giảm dần|Đừng tiến; bảo toàn nền tảng và nghỉ ngơi
Phục|Trở lại, tia sáng đầu tiên sau đêm dài|Bắt đầu lại nhẹ nhàng, đừng vội đòi nhiều
Vô Vọng|Chân thật, không toan tính|Làm điều ngay thẳng, bỏ mưu cầu may rủi
Đại Súc|Tích trữ lớn, nuôi đức và học vấn|Tích lũy năng lực, chờ thời để dùng
Di|Nuôi dưỡng thân và tâm|Chú ý lời nói, ăn uống và điều mình nuôi trong lòng
Đại Quá|Gánh nặng quá sức, xà nhà oằn|Đừng một mình gánh; tìm cách chia việc
Khảm|Hiểm trở chồng hiểm trở|Giữ lòng thành, đi qua khó khăn bằng sự đều đặn
Ly|Ánh sáng nương vào đúng chỗ|Gắn bó với điều tốt; nuôi ánh sáng nội tâm
Hàm|Cảm ứng, rung động giữa hai người|Lắng nghe cảm xúc thật, chân thành mà không ép buộc
Hằng|Bền lâu, kiên định theo đạo|Duy trì thói quen đúng; bền bỉ hơn bốc đồng
Độn|Rút lui đúng lúc|Lùi để bảo toàn sức, đó không phải thất bại
Đại Tráng|Sức mạnh lớn cần chính đạo|Có sức thì càng phải biết tiết chế
Tấn|Tiến lên như mặt trời mọc|Tỏa sáng nhờ năng lực thật, được ghi nhận dần
Minh Di|Ánh sáng bị che, thời tối|Giấu sáng, giữ ý chí bền bên trong
Gia Nhân|Việc nhà, mỗi người đúng vị trí|Chăm tổ ấm bằng lời chân thành và trách nhiệm rõ ràng
Khuê|Trái ngược, bất hòa nhưng vẫn có thể hợp|Tôn trọng khác biệt, bắt đầu từ việc nhỏ
Kiển|Chân khập khiễng, đường khó|Dừng lại tự xét, tìm người giúp và đổi hướng

praise:["Hừm, đạo hữu biết nói chuyện đấy… ta đỏ mặt rồi, may là lông trắng nên ngại cũng khó thấy.","Ta biết mà! Nhưng cứ khen thêm đi, ta không phiền đâu."],
thanks:["Có gì đâu. Lần sau mang cá khô đến là ta quý lắm.","Đừng khách sáo. Ngồi với đạo hữu ta cũng vui mà."],
joke:["Này, ta chỉ đang nghỉ thôi, không phải lười! Mà thôi lười cũng được.","Hừ, đạo hữu dám trêu ta à? Ta ghi sổ rồi nhé."],
bye:["Đi rồi à? Ghé lại nhé, ta ở đây, không đi đâu cả, vì ta lười.","Ngủ ngon, đạo hữu. Nhớ uống nước và thở chậm vài hơi."],
unk:["Hửm? Ta chưa hiểu lắm. Đạo hữu nói rõ thêm chút được không?","Ta nghiêng đầu rồi đấy nhé, mà vẫn chưa hiểu. Kể thêm chút đi?"]};
const Q={fail:["Điều gì khiến đạo hữu tiếc nhất?","Lúc đó đạo hữu đã chuẩn bị nhiều chưa, hay còn điều gì chưa kịp nói?","Nếu làm lại, đạo hữu muốn đổi điều gì? Hay chỉ muốn được nghỉ trước?"],doubt:["Hôm nay đạo hữu có nghỉ ngơi chút nào chưa?","Thử kể ta một việc nhỏ gần đây đạo hữu làm được xem?","Ai là người khiến đạo hữu nghĩ vậy, hay tự mình nghĩ ra?"],
sad:["Chuyện này mới xảy ra hay kéo dài lâu rồi?","Đạo hữu muốn ta nghe thôi, hay muốn ta nghĩ cách cùng?","Có ai ở bên đạo hữu lúc này không?"],tired:["Đạo hữu ngủ được mấy tiếng rồi?","Mệt vì việc nhiều hay vì việc nặng lòng?","Hôm nay đã ăn uống tử tế chưa? Mèo hỏi thật đấy."],
anx:["Nỗi lo ấy, nếu xảy ra thật, tệ nhất là gì?","Phần nào trong chuyện đó đạo hữu làm được ngay hôm nay?"],love:["Người đó có biết cảm giác của đạo hữu không?","Đạo hữu mong điều gì nhất ở chuyện này?","Còn phần đạo hữu, đạo hữu thấy thế nào?"],work:["Là người hay là việc làm đạo hữu mệt hơn?","Nếu bớt được một thứ trong công việc, đạo hữu bớt gì?"],study:["Đạo hữu học theo cách nào? Một mình hay nhóm?","Còn bao lâu nữa đến kỳ hạn?"],
happy:["Rồi sao nữa? Kể chi tiết cho ta nghe với!","Đạo hữu định ăn mừng thế nào?"],luck:["Hôm nay đạo hữu đang mong điều gì nhất?"],greet:["Hôm nay của đạo hữu thế nào?"],praise:["Mà đạo hữu có khen mình hôm nay chưa?"],doing:["Còn đạo hữu hôm nay làm gì?"],thanks:["Hôm nay còn gì muốn kể không?"],joke:["Thôi nào, kể ta nghe chuyện của đạo hữu đi."],unk:["Đạo hữu thử kể bằng một câu về cảm giác lúc này xem?"]};
const POSE={greet:"happy",doing:"curious",sad:"curious",fail:"curious",doubt:"curious",tired:"sleepy",anx:"curious",love:"surp",work:"curious",study:"curious",luck:"happy",happy:"happy",praise:"happy",thanks:"happy",joke:"surp",bye:"sleepy",unk:"curious"};
const S={n:0,cnt:{},used:new Set(),last:null,topic:null,hook:null};
function fresh(a,key){const f=a.filter(x=>!S.used.has(x));const c=pick(f.length?f:a);S.used.add(c);return c}
function respond(t){t=t.normalize("NFC");const n=nz(t);S.n++;let it=null;for(const [k,re] of INT)if(re.test(n)){it=k;break}
const short=n.split(/\s+/).length<=4;if(!it&&short&&S.topic&&/^(u|uh|um|vang|da|ok|khong biet|co|dung|that|chac vay)\b/.test(n))it=S.topic;
if(!it)it=/(bat ngo|khong ngo|that sao|troi oi)/.test(n)?"love":"unk";
const m=n.match(/\b(?:vi|do|ve|bi)\s+([a-z ]{3,28})/);if(m)S.hook=t.slice(m.index+m[0].length-m[1].length,m.index+m[0].length)
if(!["greet","thanks","praise","joke","unk","bye","doing","luck","happy"].includes(it))S.topic=it;
const c=S.cnt[it]=(S.cnt[it]||0)+1;let out=fresh(R[it]||R.unk,"r");
const qs=Q[it]||Q.unk;if(it!=="bye"){let q=qs[Math.min(c-1,qs.length-1)];if(c>qs.length)q=pick(qs);out+=" "+q}
if(S.hook&&c>1&&S.topic&&Math.random()<.5)out=`Chuyện “${S.hook.trim().slice(0,30)}” ấy… ta vẫn đang nghĩ về nó. `+out;
let p=POSE[it]||"curious";if(S.n>=10){p="sleepy";out+=" Hự… mà nói chuyện lâu thế này ta buồn ngủ rồi, ngáp một cái nhé."}
S.last=it;return[out,p]}
function say(w,t){const l=$("#log");l.insertAdjacentHTML("beforeend",`<div class="m ${w}">${esc(t)}</div>`);l.scrollTop=l.scrollHeight}
function send(){const v=$("#msg").value.trim();if(!v)return;$("#msg").value="";say("u",v);
if(/(tự tử|muốn chết|tự làm đau|tự hại|không muốn sống|tu tu|muon chet|tu lam dau|tu hai|khong muon song)/.test(v.normalize("NFC").toLowerCase())){say("c","Ta rất lo cho đạo hữu. Điều này quan trọng hơn mọi chuyện trò: hãy báo ngay cho một người thân tin cậy, hoặc gọi cấp cứu/đường dây hỗ trợ tâm lý ở nơi bạn sống (tại Việt Nam, 115 nếu nguy cấp). Ta vẫn ở đây.");pose("curious",4000);return}
pose("curious");setTimeout(()=>{const[o,p]=respond(v);say("c",o);pose(p,p==="sleepy"?6000:3500)},700+Math.random()*500)}
const LUCK=["Hôm nay có người sẽ nhớ đến đạo hữu mà không nói ra.","Một việc đạo hữu lo sẽ nhẹ hơn đạo hữu nghĩ.","Điều nhỏ đạo hữu kiên trì hôm nay sẽ nở ra sau này.","Bữa ăn tiếp theo của đạo hữu sẽ ngon hơn bình thường.","Có một tin tốt đang trên đường đến, hơi chậm vì nó cũng lười như ta."];
function act(a){const show=(id,ms)=>{const e=$(id);e.classList.add("on");setTimeout(()=>e.classList.remove("on"),ms)};
const d={pet:()=>{pose("cl happy",3500);say("c","Prrr… ừm, chỗ đó, chỗ cằm đó. Đừng dừng lại nhé.")},fish:()=>{show("#fish",2600);pose("eat",2600);say("c","Cá! Ngon quá. Ta ăn xong sẽ cân nhắc việc tha thứ cho đạo hữu vì đã để ta đợi.")},tea:()=>{show("#cup",5000);pose("cl",5000);say("c","Trà thơm quá. Hai ta ngồi uống rồi nói chuyện thế này mới là sống.")},call:()=>{pose("look",3000);say("c","Meo? Ai gọi ta đấy? À, đạo hữu. Ta quay đầu rồi đấy, nhớ trân trọng nhé.")},play:()=>{show("#ball",4000);pose("happy",4000);say("c","Quả bóng! Đứng yên! Ta sẽ bắt được mày! …Ta không lười khi chơi đâu nhé.")},luck:()=>{const i=Math.floor(Date.now()/864e5)%LUCK.length;pose("happy",3000);say("c","Lời chúc hôm nay: "+LUCK[i])}};d[a]()}
/* ===== KHỞI TẠO ===== */
function open(id){$(id).classList.add("on")}
function close(){document.querySelectorAll(".panel").forEach(p=>p.classList.remove("on"))}
document.querySelectorAll(".x").forEach(b=>b.onclick=close);document.querySelectorAll(".panel").forEach(p=>p.onclick=e=>{if(e.target===p)close()});
let chatInit=false;function openC(){open("#pC");if(!chatInit){chatInit=true;say("c","Meo~ Ta là Cát Cát. Ngồi xuống đi, nói gì cũng được. Ta nghe, và đôi khi ta trêu nữa.")}}
$("#hQue").onclick=$("#nQue").onclick=openQ;$("#hCat").onclick=$("#nCat").onclick=openC;
[$("#hQue"),$("#hCat")].forEach(e=>e.onkeydown=ev=>{if(ev.key==="Enter"||ev.key===" ")e.dispatchEvent(new Event("click"))});
$("#act").onclick=e=>{if(e.target.dataset.a)act(e.target.dataset.a)};$("#send").onclick=send;$("#msg").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}};
$("#nDay").onclick=()=>document.body.classList.toggle("night");
const hr=new Date().getHours();if(hr>=18||hr<5)document.body.classList.add("night");
const g=hr<11?"Chào buổi sáng":hr<13?"Chào buổi trưa":hr<18?"Chào buổi chiều":"Chào buổi tối";
$("#hello").textContent=g+". Giữa vạn điều chưa rõ, hãy dành một phút để lắng nghe chính mình. Chạm tranh cuộn để giải quẻ, chạm Cát Cát để trò chuyện.";
setInterval(()=>{if(!document.querySelector("#pC.on")&&Math.random()<.3&&!cat.getAttribute("class")){pose("sleepy",3500)}},12000);
</script></body></html>
